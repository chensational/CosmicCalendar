name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  apple-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: npm run apple:test

  apple-ui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app and widget without signing
        run: >-
          xcodebuild
          -project apple/CosmicCalendar.xcodeproj
          -scheme CosmicCalendarMac
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
