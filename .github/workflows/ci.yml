name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  apple-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: npm run apple:test

  apple-ui:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build every Apple app and widget without signing
        run: |
          set -euo pipefail
          xcodebuild -project apple/CosmicCalendar.xcodeproj -scheme CosmicCalendarMac \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project apple/CosmicCalendar.xcodeproj -scheme CosmicCalendarPhone \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project apple/CosmicCalendar.xcodeproj -scheme CosmicCalendarWatch \
            -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project apple/CosmicCalendar.xcodeproj -scheme CosmicCalendarVision \
            -destination 'generic/platform=visionOS Simulator' CODE_SIGNING_ALLOWED=NO build
